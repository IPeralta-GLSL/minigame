[package]
name = "solar_system"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "../../engine" }
wasm-bindgen = "0.2"
nalgebra = "0.32"
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebGlTexture",
    "HtmlElement",
    "CssStyleDeclaration",
] }
